name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: omc-hud
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: omc-hud
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: omc-hud
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: omc-hud.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build omc-hud
        run: cargo build --release -p omc-hud --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omc-hud-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir dist
          cp artifacts/omc-hud-x86_64-unknown-linux-gnu/omc-hud   dist/omc-hud-linux-x86_64
          cp artifacts/omc-hud-x86_64-apple-darwin/omc-hud         dist/omc-hud-macos-x86_64
          cp artifacts/omc-hud-aarch64-apple-darwin/omc-hud        dist/omc-hud-macos-arm64
          cp artifacts/omc-hud-x86_64-pc-windows-msvc/omc-hud.exe  dist/omc-hud-windows-x86_64.exe
          cd dist && sha256sum * > sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          generate_release_notes: true
